[project]
name = "weighted-compact"
version = "0.2.0b2"
description = "Trainable context-compaction substrate for Claude Code — vector-first, classifier-secondary, human-in-the-loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zzalli" }]
keywords = [
    "agent-memory",
    "context-compaction",
    "llm-memory",
    "human-in-the-loop",
    "claude-code",
    "vector-retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "click>=8.1",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
]
baselines = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
]

[project.scripts]
weighted-compact = "weighted_compact.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["weighted_compact*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# v0.0.1 lint surface kept narrow on purpose: E/F/W covers real correctness
# (syntax, undefined names, basic style). B/I/UP/SIM are queued for v0.1
# cleanup — the inherited code from the private predecessor was not written
# under ruff's gaze and gating CI on stylistic rules would block contributors
# unnecessarily. The new code in cli.py / config.py / tests passes all of
# B/I/UP/SIM cleanly; the gate will tighten incrementally as inherited
# modules are touched.
[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
