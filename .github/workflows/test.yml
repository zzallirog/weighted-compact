name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-matrix:
    name: ${{ matrix.distro }} · py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-latest
            python: "3.11"
            runs-on: ubuntu-latest
          - distro: ubuntu-latest
            python: "3.12"
            runs-on: ubuntu-latest
          - distro: archlinux
            python: "3.12"
            runs-on: ubuntu-latest
            container: archlinux:latest
          - distro: debian-stable
            python: "3.11"
            runs-on: ubuntu-latest
            container: debian:stable
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}

    steps:
      - name: Prepare Arch container
        if: matrix.distro == 'archlinux'
        run: |
          pacman -Sy --noconfirm python python-pip git ripgrep
      - name: Prepare Debian container
        if: matrix.distro == 'debian-stable'
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv git ripgrep

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        if: matrix.distro == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable + dev)
        run: |
          python3 -m venv .venv || python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Leak-scan
        run: bash scripts/leak-scan.sh

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check weighted_compact || true

      - name: Smoke tests
        env:
          WEIGHTED_COMPACT_DATA: ${{ runner.temp }}/wc-data
          WEIGHTED_COMPACT_CLAUDE_SOURCES: ${{ runner.temp }}/wc-claude
        run: |
          . .venv/bin/activate
          pytest -q tests/

      - name: CLI compat
        env:
          WEIGHTED_COMPACT_DATA: ${{ runner.temp }}/wc-data
        run: |
          . .venv/bin/activate
          weighted-compact --version
          weighted-compact compat --json
