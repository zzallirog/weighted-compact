name: outbound-zero

# Proves the runtime substrate makes zero non-localhost outbound network calls.
# Any external URL found in source code fails the build with a descriptive diff.
# Run locally with: bash scripts/outbound-zero-scan.sh --verbose

on:
  push:
  pull_request:

jobs:
  scan:
    name: No non-localhost outbound URLs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Scan for non-localhost URLs in runtime code
        run: |
          bash scripts/outbound-zero-scan.sh --verbose
        # Allowlist rules (codified in scripts/outbound-zero-scan.sh):
        #   ALWAYS allowed: http(s)://127.0.0.1, localhost, 0.0.0.0, host.docker.internal
        #   EXCEPTION: openrouter.ai — only in scripts/sonnet_rejudge.py (maintainer rejudge)
        #   EXCEPTION: api.anthropic.com — only in weighted_compact/baselines/compact_simulator.py
        #   EXCEPTION: github.com — allowed in comments, docs, and the two approved scripts
        #   FORBIDDEN: generativelanguage.googleapis.com, openai.com, or any unregistered domain
        #
        # To add a new exception: update scripts/outbound-zero-scan.sh and document here.
