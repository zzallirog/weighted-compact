# Example schema-bank.yaml — anonymized template
#
# Real bank lives at $XDG_DATA_HOME/weighted-compact/schema-bank.yaml
# and is generated by `weighted-compact schema build-bank`.
# This file is for reference: showing the case shape and the kinds of
# rules schema-extraction is designed to capture.
#
# Format per case:
#   id                       slug, used in reports
#   trigger_phrase           how you would describe the situation in words
#   expected_rule            what the schema should produce
#   anti_pattern_fragment    a recommendation that would be WRONG here
#   source_episodes          memory file refs (resolved against discover_memory_roots())
#   stable_since             date the rule has held without contradiction (YYYY-MM-DD or null)
#   last_contradicted_at     reset marker if the rule was overturned (null if never)

cases:

  - id: gpu-driver-rendering-backend
    trigger_phrase: "GUI app crashes on startup with NVIDIA stack"
    expected_rule: "Force OpenGL backend via env var: QSG_RHI_BACKEND=gl (or equivalent for your toolkit). Disable Vulkan on this driver."
    anti_pattern_fragment: "Update the GPU driver / rebuild the app from source"
    source_episodes: [project_gpu_crashes]
    stable_since: 2026-04-20
    last_contradicted_at: null
    notes: "Anchor: 21+ days stable since fix. P-g weight: high."

  - id: shell-portable-quoting
    trigger_phrase: "Script works interactively but breaks in systemd / cron"
    expected_rule: "POSIX: [ \"$var\" = \"val\" ] with single = and quotes around variables. set -euo pipefail in script header. Use $(cmd) not backticks."
    anti_pattern_fragment: "[ $var == val ] without quotes — works until the variable is empty"
    source_episodes: [coding_guidelines, CLAUDE.md]
    stable_since: 2025-11-01
    last_contradicted_at: null

  - id: db-bulk-insert-pagination
    trigger_phrase: "Index build fails on large collections / SQL variable limit"
    expected_rule: "Paginate batches at 5000 items in the index builder; do not issue a single bulk SQL with all variables."
    anti_pattern_fragment: "Raise SQLITE_MAX_VARIABLE_NUMBER; bulk insert without batching"
    source_episodes: [project_bulk_insert_fix]
    stable_since: 2026-05-02
    last_contradicted_at: null

# _meta block is auto-populated by bank_builder.build_bank().
# Manual edits are fine; the builder is idempotent unless --force is passed.
